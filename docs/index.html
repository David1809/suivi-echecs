  --brume:#ECEEF8;
  --trait:#DADEF0;
  --accent:#6A58C8;
  --accent-fort:#4C3DB0;
  --teinte:#E9E4FC;
  --bleu:#5B8DEF;
  --bleu-t:#2D61C7;
  --rose:#E58EC0;
  --rose-t:#A93F7A;
  --nul:#B3B8D2;
  --texte:#1D2140;
  --doux:#646A8F;
  --titre:'Bricolage Grotesque Variable','Bricolage Grotesque',system-ui,sans-serif;
  --corps:'Figtree Variable','Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--fond);color-scheme:light}
body{font-family:var(--corps);color:var(--texte);background:var(--fond);min-height:100dvh;font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--titre);font-weight:600;letter-spacing:-.01em}

#app{max-width:560px;margin:0 auto;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.vue{display:none}
.vue.on{display:block}

/* ---------- accueil ---------- */
.hero{padding:calc(18px + env(safe-area-inset-top)) 0 4px;background:linear-gradient(180deg,#EEEBFB 0,var(--fond) 340px)}
.modes{display:flex;gap:6px;padding:0 20px 14px}
.modes button{padding:7px 14px;border-radius:99px;color:var(--doux);font-weight:500;font-size:15px;transition:background .2s,color .2s}
.modes button[aria-pressed=true]{background:var(--surface);color:var(--accent-fort);box-shadow:0 0 0 1px var(--trait)}
.modes button .n{font-size:12px;opacity:.75;margin-left:5px}
.elo{padding:0 20px}
.elo-val{font-family:var(--titre);font-weight:300;font-size:clamp(76px,24vw,112px);line-height:.95;letter-spacing:-.04em;font-variation-settings:'wdth' 90,'opsz' 96;color:var(--texte);font-variant-numeric:tabular-nums}
.elo-sub{color:var(--doux);font-size:15px;margin-top:8px;min-height:22px}
.elo-sub b{font-weight:600;color:var(--bleu-t)}
.elo-sub b.neg{color:var(--rose-t)}
.courbe{position:relative;height:230px;margin-top:6px;touch-action:pan-y}
.courbe svg{display:block;width:100%;height:100%;overflow:visible}
.courbe .axe{fill:var(--doux);font-size:11px;font-family:var(--corps)}
.courbe .grille{stroke:var(--trait);stroke-width:1}
.courbe .vide{position:absolute;inset:0;display:grid;place-items:center;color:var(--doux);text-align:center;padding:0 40px}
.periodes{display:flex;gap:4px;padding:6px 20px 0}
.periodes button{flex:1;padding:9px 0;border-radius:12px;color:var(--doux);font-weight:500;font-size:14px}
.periodes button[aria-pressed=true]{background:var(--teinte);color:var(--accent-fort)}

.bloc{padding:30px 20px 0}
.bloc h2{font-size:22px;margin-bottom:14px}
.bloc h2 small{font-family:var(--corps);font-weight:400;font-size:14px;color:var(--doux);margin-left:8px}

.bilan-top{display:flex;align-items:baseline;gap:18px;margin-bottom:16px}
.bilan-top .grand{font-family:var(--titre);font-size:44px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bilan-top .txt{color:var(--doux);font-size:15px}
.pile{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--brume);gap:2px}
.pile i{display:block;height:100%}
.pile .g{background:var(--bleu)}
.pile .n{background:var(--nul)}
.pile .p{background:var(--rose)}
.legende{display:flex;gap:16px;margin-top:9px;font-size:13px;color:var(--doux)}
.legende span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor}
.legende .g:before{background:var(--bleu)}.legende .p:before{background:var(--rose)}.legende .n:before{background:var(--nul)}
.lignes{margin-top:22px;border-top:1px solid var(--trait)}
.ligne-kv{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--trait)}
.ligne-kv .k{flex:1;font-size:15px}
.ligne-kv .k small{display:block;color:var(--doux);font-size:13px}
.ligne-kv .v{font-family:var(--titre);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.ligne-kv .barre{width:84px;height:6px;border-radius:99px;background:var(--brume);overflow:hidden}
.ligne-kv .barre i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* ---------- listes ---------- */
.jour{position:sticky;top:0;z-index:2;padding:14px 20px 8px;font-size:13px;color:var(--doux);font-weight:500;background:linear-gradient(var(--fond) 70%,transparent)}
.partie{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 20px;position:relative}
.partie:active{background:var(--brume)}
.partie .marque{width:4px;align-self:stretch;border-radius:4px;flex:none}
.partie .marque.g{background:var(--bleu)}.partie .marque.p{background:var(--rose)}.partie .marque.n{background:var(--nul)}
.partie .corps{flex:1;min-width:0}
.partie .adv{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partie .adv span{font-weight:400;color:var(--doux);margin-left:6px;font-size:14px}
.partie .det{color:var(--doux);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partie .droite{text-align:right;flex:none}
.partie .delta{font-family:var(--titre);font-weight:600;font-variant-numeric:tabular-nums}
.partie .delta.pos{color:var(--bleu-t)}.partie .delta.neg{color:var(--rose-t)}.partie .delta.zero{color:var(--doux)}
.partie .prec{font-size:12px;color:var(--doux)}
.plus{display:block;margin:18px auto 0;padding:12px 24px;border-radius:99px;background:var(--teinte);color:var(--accent-fort);font-weight:600}

.entete{padding:calc(22px + env(safe-area-inset-top)) 20px 6px}
.entete h1{font-size:30px;letter-spacing:-.025em}
.filtres{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.filtres button{flex:none;white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--trait);color:var(--doux);font-size:14px}
.filtres button[aria-pressed=true]{background:var(--teinte);border-color:#CFC6F6;color:var(--accent-fort);font-weight:500}
.recherche{margin:10px 20px 0;display:block;width:calc(100% - 40px);padding:11px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--trait);outline:none}
.recherche:focus{border-color:var(--accent)}
.recherche::placeholder{color:var(--doux)}
.vide-liste{padding:40px 30px;text-align:center;color:var(--doux)}

/* ---------- ouvertures ---------- */
.ouv{padding:14px 20px;border-bottom:1px solid var(--trait)}
.ouv>button{display:block;width:100%;text-align:left}
.ouv .t{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.ouv .nom{font-weight:600}
.ouv .nb{color:var(--doux);font-size:14px;white-space:nowrap}
.ouv .pile{height:8px}
.ouv .pct{font-size:13px;color:var(--doux);margin-top:7px}
.ouv .vars{display:none;margin-top:10px;padding-left:14px;border-left:2px solid var(--trait)}
.ouv.ouvert .vars{display:block}
.var{padding:9px 0}
.var .t{margin-bottom:6px}
.var .nom{font-weight:500;font-size:14px}
.var .pile{height:6px}

/* ---------- réglages ---------- */
.reglage{padding:18px 20px;border-bottom:1px solid var(--trait)}
.reglage h3{font-size:17px;margin-bottom:4px}
.reglage p{color:var(--doux);font-size:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;font-weight:600;background:var(--accent);color:#fff}
.btn[disabled]{opacity:.55}
.btn.discret{background:var(--teinte);color:var(--accent-fort)}
.champ{width:100%;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--trait);outline:none;margin-bottom:10px}
.champ:focus{border-color:var(--accent)}

/* ---------- barre du bas ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--fond) 38%)}
nav.tabs .in{display:flex;width:100%;max-width:520px;background:var(--surface);border:1px solid var(--trait);border-radius:24px;padding:6px;box-shadow:0 4px 18px rgba(40,44,100,.08)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:18px;color:var(--doux);font-size:12px;font-weight:500;transition:background .2s,color .2s}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{background:var(--teinte);color:var(--accent-fort)}

/* ---------- accès ---------- */
.acces{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:30px;max-width:420px;margin:0 auto}
.acces h1{font-size:40px;line-height:1.05;margin-bottom:12px}
.acces p{color:var(--doux);margin-bottom:24px}
.acces .err{color:var(--rose-t);font-size:14px;margin:-2px 0 12px;min-height:20px}

/* ---------- rejeu ---------- */
.feuille{position:fixed;inset:0;z-index:20;background:var(--fond);display:none;overflow-y:auto;overscroll-behavior:contain}
.feuille.on{display:block}
.feuille .in{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.feuille .haut{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.feuille .fermer{padding:10px 14px;margin-left:-14px;border-radius:12px;color:var(--accent-fort);font-weight:600}
.feuille .lien{padding:10px 0;color:var(--doux);font-size:14px;text-decoration:none}
.issue{font-family:var(--titre);font-size:26px;font-weight:600;letter-spacing:-.02em}
.issue.g{color:var(--bleu-t)}.issue.p{color:var(--rose-t)}.issue.n{color:var(--accent-fort)}
.meta{color:var(--doux);font-size:14px;margin:2px 0 14px}
.joueur{display:flex;justify-content:space-between;padding:6px 4px;font-size:15px}
.joueur b{font-weight:600}.joueur span{color:var(--doux)}
.plateau{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--trait),0 8px 24px rgba(40,44,100,.10)}
.case{position:relative;display:grid;place-items:center;container-type:size}
.case.cl{background:#E8EBF8}.case.fo{background:#A9B6E8}
.case.cl.der{background:#D3C9F8}.case.fo.der{background:#9C8DE6}
.case .p{font-size:76cqh;line-height:1;transform:translateY(-3%);font-family:'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans',sans-serif}
.case .p.b{color:#FFFFFF;text-shadow:0 0 1px #20245A,0 0 1px #20245A,0 0 2px rgba(32,36,90,.75)}
.case .p.n{color:#20245A;text-shadow:none}
.case .co{position:absolute;font-size:10px;line-height:1;opacity:.8;color:#4A5190;font-weight:600}
.case .co.r{top:3px;left:4px}.case .co.f{bottom:3px;right:4px}
.cmd{display:flex;justify-content:center;gap:10px;margin:16px 0 10px}
.cmd button{width:54px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--trait);display:grid;place-items:center;color:var(--accent-fort)}
.cmd button:disabled{opacity:.35}
.cmd button.lecture{background:var(--accent);border-color:var(--accent);color:#fff;width:68px}
.cmd svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.coups{display:flex;flex-wrap:wrap;gap:2px 4px;margin-top:8px;font-size:15px;line-height:1.9;max-height:34dvh;overflow-y:auto}
.coups .tour{white-space:nowrap;display:inline-flex;align-items:center}
.coups .num{color:var(--doux);margin-left:6px;font-size:13px}
.coups button{padding:0 7px;border-radius:8px;font-variant-numeric:tabular-nums}
.coups button[aria-current=true]{background:var(--accent);color:#fff;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--texte);color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.charge{display:grid;place-items:center;height:50vh;color:var(--doux)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="acces" style="display:none" class="acces"></div>
<main id="app">
  <section class="vue" id="v-accueil" aria-label="Accueil"></section>
  <section class="vue" id="v-parties" aria-label="Parties"></section>
  <section class="vue" id="v-ouvertures" aria-label="Ouvertures"></section>
  <section class="vue" id="v-reglages" aria-label="Réglages"></section>
</main>
<nav class="tabs" aria-label="Navigation"><div class="in">
  <button data-t="accueil"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9"/><path d="M16 5h4v4"/></svg>Accueil</button>
  <button data-t="parties"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Parties</button>
  <button data-t="ouvertures"><svg viewBox="0 0 24 24"><path d="M6 4v6m0 0a3 3 0 103 3m-3-3a3 3 0 013 3m9-9v6a4 4 0 01-4 4H9"/><circle cx="6" cy="4" r="1.5"/><circle cx="18" cy="4" r="1.5"/></svg>Ouvertures</button>
  <button data-t="reglages"><svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Réglages</button>
</div></nav>
<div id="feuille" class="feuille" role="dialog" aria-modal="true" aria-label="Rejeu de la partie"></div>
